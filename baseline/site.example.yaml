# Organisation-specific values. Copy to site.yaml and edit; build.py reads site.yaml if present,
# otherwise this file. Empty lists and tables mean "nothing allowed"; null means "not set".

mcp_allowlist:
  claude: []        # e.g. [{serverName: github}]
  codex: {}         # e.g. {github: {identity: {command: "github-mcp-server"}}}

# Starter allowlist: git hosting, package registries, the agents' APIs. baseline/site.strict.yaml closes everything.
# EXFILTRATION CHANNEL: github.com, api.github.com and codeload.github.com accept a push, a gist or an issue
# from any account, so code can leave through them inside the sandbox. Replace them with your own git host
# (GitHub Enterprise, GitLab, a mirror). If you keep them, keep R19 too: every command then asks first.
egress:
  allow: [github.com, api.github.com, codeload.github.com, registry.npmjs.org, pypi.org, files.pythonhosted.org,
          api.anthropic.com, api.openai.com]
  codex_domains: {github.com: allow, api.github.com: allow, codeload.github.com: allow, registry.npmjs.org: allow,
                  pypi.org: allow, files.pythonhosted.org: allow, api.anthropic.com: allow, api.openai.com: allow}

marketplaces:
  claude: []        # e.g. [{source: github, repo: example-org/approved-plugins}]
  codex: {}         # e.g. {company: {source: git, url: "https://git.example.org/plugins.git"}}

api:
  claude_base_url: https://api.anthropic.com   # or the company's LLM gateway
  codex_model_provider: openai                 # or the id of a provider the company defines (R16)

versions:
  claude:
    min: "2.1.285"  # the oldest release that enforces every rule (min_version in rules.yaml); build.py refuses lower
    max: null       # set from the release gate's admitted range

login:
  claude_method: null      # "claudeai" | "console" | "gateway"
  claude_org_uuid: null
  codex_methods: null      # e.g. [chatgpt]
  codex_workspaces: null   # e.g. ["<workspace id>"]

# Where agent telemetry goes (R21). Replace the collector; prompt text is not exported.
telemetry:
  claude_env:
    CLAUDE_CODE_ENABLE_TELEMETRY: "1"
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector.example.org:4318
  codex_exporter:
    otlp-http: {endpoint: "https://otel-collector.example.org:4318/v1/logs", protocol: binary}
